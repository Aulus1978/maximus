{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">EVOLUÇÃO CONCEITUAL</span><h1>Registrar gap</h1><p>Use gaps para capacidades ausentes; material legado perdido pertence ao estado “A reconstruir”.</p></div><form method="post" class="form-card"><div class="form-grid"><label>Módulo*<select name="module_id">{% for m in modules %}<option value="{{m.id}}" {{'selected' if request.args.get('module')==m.id|string}}>{{m.name}}</option>{% endfor %}</select></label><label>Posição estrutural<select name="position_id"><option value="">Pendente de classificação</option>{% for p in positions %}<option value="{{p.id}}">{{p.module_name}} · {{p.code}} {{p.name}}</option>{% endfor %}</select></label><label>Prioridade*<select name="priority"><option>Alta</option><option>Média</option><option>Baixa</option></select></label><label>Situação*<select name="situation">{% for x in ['Identificado','Em estudo','Em desenvolvimento','Resolvido'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Ferramenta gerada<select name="generated_tool_id"><option value="">Nenhuma</option>{% for t in tools %}<option value="{{t.id}}">{{t.code}} · {{t.name}}</option>{% endfor %}</select></label></div><label>Título*<input name="title" required></label><label>Descrição*<textarea name="description" required></textarea></label><label>Motivo*<textarea name="reason" required></textarea></label><label>Possíveis ferramentas futuras<input name="future_tools"></label><div class="form-actions"><a href="{{url_for('main.home')}}">Cancelar</a><button class="button">Registrar gap</button></div></form>{% endblock %}
