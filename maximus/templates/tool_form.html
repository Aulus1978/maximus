{% extends 'base.html' %}{% block title %}Nova ferramenta · MAXIMUS{% endblock %}{% block content %}
<div class="page-title"><span class="eyebrow">CATÁLOGO</span><h1>Nova ferramenta</h1><p>Registre a evidência histórica e o estado atual sem apagar sua origem.</p></div>
<form method="post" class="form-card"><h2>Identificação</h2><div class="form-grid">
<label>Validação*<select name="validation_status" required><option value="confirmed">Confirmada</option><option value="under_review">Em validação</option></select></label>
<label>Módulo*<select name="module_id" required>{% for m in modules %}<option value="{{m.id}}" data-slug="{{m.slug}}" {{'selected' if request.args.get('module')==m.id|string}}>{{m.name}} · {{m.subtitle}}</option>{% endfor %}</select><input type="hidden" name="module_slug" value="{{modules[0].slug}}"></label>
<label>Posição estrutural*<select name="position_id" required>{% for p in positions %}<option value="{{p.id}}">{{p.module_name}} · {{p.code}} {{p.name}}</option>{% endfor %}</select></label>
<label>Categoria<select name="category_id"><option value="">Selecione</option>{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></label><label>Código*<input name="code" required placeholder="COMBAT-004"></label><label>Nome*<input name="name" required></label><label>Identificador URL*<input name="slug" required></label><label>Versão<input name="version" value="1.0"></label><label>Ordem<input name="display_order" type="number" value="0"></label><label>Existência*<select name="existence" required>{% for x in ['Existe','Não encontrada','A reconstruir'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Status*<select name="status" required>{% for x in ['Original','Digitalizada','Operacional'] %}<option>{{x}}</option>{% endfor %}</select></label></div>
<label>Descrição resumida*<textarea name="summary" required></textarea></label><h2>Conhecimento da ferramenta</h2><div class="form-grid two"><label>Função no módulo<textarea name="module_function"></textarea></label><label>Objetivo<textarea name="objective"></textarea></label><label>Descrição<textarea name="description"></textarea></label><label>Metodologia original<textarea name="original_method"></textarea></label><label>Versão atual<textarea name="current_version"></textarea></label><label>Entradas<textarea name="inputs"></textarea></label><label>Processamento<textarea name="processing"></textarea></label><label>Saídas<textarea name="outputs"></textarea></label><label>Página no Sistema Maximus<input name="system_path"></label></div><div class="form-actions"><a href="{{url_for('main.home')}}">Cancelar</a><button class="button">Cadastrar ferramenta</button></div></form>{% endblock %}
